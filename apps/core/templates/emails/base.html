<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f1ec; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#2d2a26;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f1ec;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px;">
          <tr>
            <td style="padding:28px 32px 0; font-size:20px; font-weight:700; color:#c2410c;">
              Love and Tails
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 32px; font-size:16px; line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0; font-size:12px; color:#8a817a;">
          {% block footer %}You're receiving this email because of activity on Love and Tails.{% endblock %}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
