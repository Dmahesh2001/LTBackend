services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: loveandtails
      POSTGRES_USER: loveandtails
      POSTGRES_PASSWORD: loveandtails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loveandtails -d loveandtails"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
